name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        run: pip install "qiskit[visualization]>=2.4,<3" ruff mypy pytest
      - name: verify
        run: ./verify.sh
